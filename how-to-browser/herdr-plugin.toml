id = "local.howto.browser"
name = "Local Browser"
version = "0.1.0"
min_herdr_version = "0.8.2"
description = "Open clicked URLs in an in-terminal browser (cmd+click opens your system browser). Requires the terminal-browser engine (bootstrapped during herdr plugin install, or provided via TERMINAL_BROWSER_BIN)."
platforms = ["macos", "linux"]

[[panes]]
id = "browser"
title = "Browser"
placement = "split"
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/bin/pane.sh\""]

[[actions]]
id = "open-url"
title = "Open URL in in-terminal browser"
contexts = ["global", "pane"]
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/bin/open_url.sh\""]

[[actions]]
id = "open-pane"
title = "Open in-terminal browser pane"
contexts = ["global", "pane"]
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/bin/pane.sh\""]

[[link_handlers]]
id = "http"
title = "Open clicked URL in in-terminal browser"
pattern = "^https?://"
action = "open-url"

# Declared dependency: this plugin drives the external terminal-browser engine.
# herdr runs this build step during 'herdr plugin install' to bootstrap it.
# Build commands do not receive HERDR_PLUGIN_ROOT, but their cwd IS the plugin's
# own subdirectory — so reference the helper by relative path.
[[build]]
platforms = ["linux", "macos"]
command = ["sh", "bin/build-engine.sh"]
