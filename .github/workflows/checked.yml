name: check
on: [push, pull_request]
permissions: {}
jobs:
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: verify every plugin manifest declares required metadata
        run: |
          set -eu
          count=0
          while IFS= read -r m; do
            count=$((count+1))
            echo "checking $m"
            for key in '^id =' '^name =' '^version =' '^min_herdr_version ='; do
              grep -Eq "$key" "$m" || { echo "$m missing $key"; exit 1; }
            done
          done < <(find . -name herdr-plugin.toml -not -path '*/node_modules/*')
          [ "$count" -ge 1 ] && echo "validated $count plugin manifest(s)"
